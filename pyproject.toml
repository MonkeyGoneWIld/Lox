[project]
name = "lox"
version = "1.0.0"
description = "An uploading script for Gazelle-based music trackers."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp-jinja2>=1.6",
    "aiohttp[speedups]>=3.14.3",
    "aiolimiter>=1.2.1",
    "anyio>=4.14.2",
    "asyncclick>=8.4.2.1",
    "av>=18.1.0",
    "beautifulsoup4[lxml]>=4.15.0",
    "deluge-client>=1.10.2",
    "humanfriendly>=10.0",
    "jinja2>=3.1.6",
    "msgspec[toml]>=0.21.1",
    "musicbrainzngs>=0.7.1",
    "mutagen>=1.48.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "platformdirs>=4.11.4",
    "pycambia>=0.2.0",
    # Blowfish, for decrypting Deezer media streams.
    "pycryptodome>=3.23.0",
    "pyimgbox>=1.0.7",
    "pyoxipng>=9.1.1",
    "pyperclip>=1.11.0",
    "qbittorrent-api>=2026.8.1",
    "requests>=2.34.2",
    "send2trash>=2.1.0",
    "tenacity>=9.1.4",
    "torf>=4.3.1",
    "tqdm>=4.70.0",
    "transmission-rpc>=7.0.12",
    "unidecode>=1.4.0",
]

[project.scripts]
lox = "run:main"

[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lox", "data"]
py-modules = ["run"]

[dependency-groups]
dev = ["ruff>=0.16.5"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-type-checking
    "TC",
]

[tool.ruff.lint.per-file-ignores]
# run.py imports command modules for their side effects (registering CLI commands)
"run.py" = ["F401"]

[tool.pyright]
include = ["lox"]
typeCheckingMode = "standard"
reportPossiblyUnboundVariable = "warning"
reportUnreachable = "warning"
reportInvalidCast = "warning"
reportUnsafeMultipleInheritance = "warning"
reportImplicitAbstractClass = "warning"
reportInvalidAbstractMethod = "warning"
reportPrivateImportUsage = "none"
