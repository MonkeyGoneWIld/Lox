# lox bootstrap configuration
#
# Only what the server needs BEFORE it can serve the settings page. Everything
# else — Deezer ARL, tracker credentials, image hosts, seeding layout, budgets,
# notifications — is configured in the UI under Settings, with a Test button per
# section, and is stored separately in settings.toml beside this file.
#
# lox never rewrites this file.

[directory]
# Where releases live. In Docker these are fixed by the volume mounts.
download_directory = '/downloads'
dottorrents_dir = '/torrents'

[upload.web_interface]
# 0.0.0.0 inside a container so the published port works.
host = '0.0.0.0'
# Keep below 32768: ports in the ephemeral range can be transiently taken by an
# outbound connection, which makes the container port bind fail at random.
port = 5015
# REQUIRED. Minimum 16 characters: openssl rand -hex 32
# The UI asks for this on first load and remembers it in a cookie for 30 days.
auth_token = 'CHANGE-ME-openssl-rand-hex-32'
