# Optional. docker-compose.yml sets everything here through LOX_* environment
# variables instead, which is the simpler path — see the compose file.
#
# Use this file only if you would rather not put the auth token in the
# environment. Environment variables win over anything set here.
#
# Everything not in this file is configured in the UI under Settings and stored
# in settings.toml. lox never rewrites either file.

[directory]
download_directory = '/data/media/deemix'
dottorrents_dir = '/config/torrents'
tmp_dir = '/config/spectrals'

[upload.web_interface]
host = '0.0.0.0'
port = 5015
# Minimum 16 characters: openssl rand -hex 32
# The UI asks for this on first load and remembers it in a cookie for 30 days.
auth_token = 'CHANGE-ME-openssl-rand-hex-32'

[checker]
state_dir = '/config/state'
