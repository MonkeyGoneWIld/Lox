# lox — Deezer to Gazelle upload pipeline
#
# No config file needed. Everything the server needs to start is below;
# everything else — Deezer ARL, tracker credentials, image hosts, seeding
# layout, budgets, notifications — is set in the UI under Settings, each with a
# Test button, and stored in settings.toml on the mounted volume.
#
# Two things to get right:
#
# 1. Sign-in. The first person to open the UI is asked to create a username
#    and password; until that exists every route goes to setup, so the port is
#    never briefly open. LOX_AUTH_TOKEN below is optional and only there for
#    scripts and the healthcheck.
#
# 2. The downloads directory and the seeding directory must be on the SAME
#    filesystem. Hardlinks cannot cross filesystems. Mounting their common
#    parent as one volume is the simplest way to guarantee it.
#
# LOX_DOWNLOAD_DIR is a path *inside* the container, so it has to sit under a
# volume you actually mounted — with the mounts below, /data/media/deemix means
# ${NAS}/data/media/deemix on the host. It is created if missing, but only the
# part below the mount point: if the volume itself is wrong, the directory gets
# made inside the container and vanishes on the next restart. lox reports what
# it found at the nearest existing parent so you can tell the two apart, and any
# path here can be corrected under Settings → Paths without touching this file.

services:
  lox:
    image: ghcr.io/monkeygonewild/lox:alpha
    # Or build from source:
    # build: https://github.com/MonkeyGoneWIld/Lox.git#main
    container_name: lox
    restart: unless-stopped
    command: ["ui"]

    ports:
      # Scope this to one interface. Keep the host port below 32768 — ports in
      # the ephemeral range can be transiently taken by an outbound connection,
      # which makes the bind fail at random.
      - "127.0.0.1:5015:5015"

    environment:
      TZ: ${TZ:-Etc/UTC}

      # --- bootstrap: read before the settings page exists ---------------
      LOX_HOST: "0.0.0.0"
      LOX_PORT: "5015"
      # Optional: an additional shared secret for scripts and the healthcheck.
      # People sign in with an account created on first use, so leaving this
      # empty is fine. openssl rand -hex 32 if you want one.
      LOX_AUTH_TOKEN: ${LOX_AUTH_TOKEN:-}
      LOX_DOWNLOAD_DIR: "/data/media/deemix"
      LOX_TORRENTS_DIR: "/config/torrents"
      LOX_TMP_DIR: "/config/spectrals"
      LOX_STATE_DIR: "/config/state"
      LOX_LOG_DIR: "/config/logs"
      # The address you actually reach the UI on. LOX_HOST is the bind
      # address, which is 0.0.0.0 here and useless in a link.
      LOX_DISPLAY_HOST: "192.168.1.25"
      # Where the UI writes everything else.
      LOX_SETTINGS_DIR: "/config"

      HOME: /config

    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      # settings.toml, the database, .torrent output and spectral scratch.
      - ${CONFIG:-./config}/lox:/config
      # One mount for media: downloads and hardlink targets share a filesystem.
      - ${NAS:-./data}/data:/data

    healthcheck:
      # /api/health needs no credentials and reveals nothing, so this keeps
      # working whether or not a shared token is set.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5015/api/health', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.centurylinklabs.watchtower.enable=false"
